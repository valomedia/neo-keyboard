name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    uses: valomedia/github-workflows/.github/workflows/ios-ci.yml@dced356558fff409addc69828448854793927b4f # v1.3.0
    with:
      workspace: Neo Keyboard.xcodeproj/project.xcworkspace
      scheme: German Neo
      install-command: ''
      xcode-path: ''
      lint-command: scripts/lint
      build-command: |
        set -euo pipefail
        xcodebuild build \
          -project "Neo Keyboard.xcodeproj" \
          -scheme "German Neo" \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO
      unit-test-command: |
        set -euo pipefail
        xcodebuild test \
          -project "Neo Keyboard.xcodeproj" \
          -scheme "German Neo" \
          -destination "platform=iOS Simulator,id=${IOS_CI_SIMULATOR_UDID}" \
          CODE_SIGNING_ALLOWED=NO
